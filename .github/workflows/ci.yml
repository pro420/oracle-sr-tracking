name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[web]'
      - run: python -m unittest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t srtrack .
      - name: Smoke test
        run: |
          docker run -d --name srt -p 8000:8000 -e SRT_PASSWORD=ci srtrack
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u srt:ci localhost:8000/)" = 200
