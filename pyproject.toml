[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srtrack"
version = "0.1.0"
description = "Fast command-line tracker for Oracle Support Service Requests (SRs)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0,<4", "gunicorn>=22"]

[project.scripts]
srt = "srtrack.cli:main"

[tool.setuptools]
packages = ["srtrack"]

[tool.setuptools.package-data]
srtrack = ["templates/*.html", "static/*"]
